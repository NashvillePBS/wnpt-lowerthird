<!doctype html>
<html><head><meta charset="utf-8"><title>Event Signs self-test</title>
<style>
@font-face{font-family:"PBS Sans";src:url("../fonts/PBSSans.woff2") format("woff2");font-weight:400;font-style:normal}
@font-face{font-family:"PBS Sans";src:url("../fonts/PBSSans-Medium.woff2") format("woff2");font-weight:500;font-style:normal}
@font-face{font-family:"PBS Sans";src:url("../fonts/PBSSans-Bold.woff2") format("woff2");font-weight:700;font-style:normal}
@font-face{font-family:"PBS Sans";src:url("../fonts/PBSSans-Black.woff2") format("woff2");font-weight:800;font-style:normal}
body{margin:0;font-family:"PBS Sans",Arial,sans-serif}
</style>
<script src="../vendor/html-to-image.js"></script>
<script src="../vendor/qrcode.js"></script>
<script src="../shared/studio-core.js"></script>
<script src="signs.js"></script>
</head><body>
<!-- Headless harness (scripts/verify-graphics.py): exports each case as the real PDF plus a PNG of the same
     frame with every readable element hidden, and prints the results as JSON. Not linked from the tool. -->
<pre id="out"></pre>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const only = q.get('style');
  const LOGO = (w, h, fill, text) => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h + '"><rect width="' + w + '" height="' + h + '" rx="' + Math.min(w, h) / 8 + '" fill="' + fill + '"/><text x="50%" y="55%" font-family="Arial" font-size="' + Math.min(w, h) / 3 + '" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">' + text + '</text></svg>');
  const LOGOS = [
    { name: 'wide.svg', src: LOGO(320, 90, '#5C6E85', 'WIDE PARTNER') },
    { name: 'square.svg', src: LOGO(120, 120, '#2638C4', 'SQ') },
    { name: 'tall.svg', src: LOGO(80, 160, '#0A145A', 'T') }
  ];
  const CASES = {
    'welcome-letter-portrait':         { sign: 'welcome', fields: { subline: 'Community Screening and Conversation' } },
    'welcome-navy-letter-landscape':   { sign: 'welcome', colorway: 'navy', orientation: 'landscape', fields: { subline: 'Community Screening and Conversation' } },
    'directional-letter-portrait':     { sign: 'directional' },
    'directional-letter-landscape':    { sign: 'directional', orientation: 'landscape', fields: { headline: 'Auditorium', arrow: 'up-right' } },
    'directional-tabloid-portrait':    { sign: 'directional', size: 'tabloid', fields: { headline: 'Registration', arrow: 'left' } },
    'directional-tabloid-landscape':   { sign: 'directional', size: 'tabloid', orientation: 'landscape', fields: { headline: 'Studio A', arrow: 'down' } },
    'reserved-letter-portrait':        { sign: 'reserved', fields: { subline: 'Board of Directors' } },
    'registration-letter-portrait':    { sign: 'registration', fields: { subline: 'Please have your name ready' } },
    'restrooms-letter-portrait':       { sign: 'restrooms' },
    'quiet-letter-portrait':           { sign: 'quiet' },
    'photo-letter-portrait':           { sign: 'photo' },
    'custom-letter-landscape':         { sign: 'custom', orientation: 'landscape', accent: 'teal', fields: { headline: 'Green Room', subline: 'Guests and crew only', arrow: 'none' } },
    'partners-letter-portrait':        { sign: 'welcome', fields: { subline: 'Community Screening and Conversation', partnerLabel: 'Supported by', partners: LOGOS } },
    'partners-seven-letter-landscape': { sign: 'welcome', orientation: 'landscape', fields: { subline: 'Community Screening', partnerLabel: 'Supported by', partners: LOGOS.concat(LOGOS, [LOGOS[0]]) } },
    'donate-letter-portrait':          { sign: 'donate' },
    'donate-letter-landscape':         { sign: 'donate', orientation: 'landscape', tracked: { donate: 'https://wnpt.tv/donate-sign' } },
    'apps-letter-portrait':            { sign: 'apps', tracked: { apps: { station: 'https://wnpt.tv/wnptpbs-app' } }, fields: { apps: { pbs: true, station: true, kids: true } }, enableStation: true },
    'apps-two-tabloid-landscape':      { sign: 'apps', size: 'tabloid', orientation: 'landscape', fields: { apps: { pbs: true, station: false, kids: true } } },
    'apps-kids-only-letter-portrait':  { sign: 'apps', fields: { apps: { pbs: false, station: false, kids: true } } },
    'custom-qr-letter-portrait':       { sign: 'custom', fields: { headline: 'Tonight\'s Program', subline: 'Scan for the program notes', url: 'wnpt.org/events', shortURL: 'https://wnpt.tv/notes' } },
    'custom-qr-other-letter-portrait': { sign: 'custom', fields: { headline: 'Survey', subline: 'Two minutes, anonymous', url: 'https://forms.example.org/some/very/long/path?x=1', shortURL: 'https://wnpt.tv/survey', showAddress: true } }
  };
  if (q.get('list')) { document.getElementById('out').textContent = JSON.stringify({ cases: Object.keys(CASES) }); document.title = 'DONE'; return; }
  const toDataUrl = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
  const out = { fontsOk: false, results: {} };
  try {
    await document.fonts.load('800 132px "PBS Sans"');
    out.fontsOk = document.fonts.check('800 132px "PBS Sans"') && document.fonts.check('500 40px "PBS Sans"');
    for (const [name, c] of Object.entries(CASES)) {
      if (only && only !== name) continue;
      const state = EventSigns.defaultState(c.sign);
      // Tracked links are config in production (Shane's files); a case may override one with a stand-in URL
      // (generated code) or clear it with '' to exercise the missing-link path.
      EventSigns.CONFIG.apps.station.enabled = !!c.enableStation; // the launch switch, exercised once here
      if (!window.__trackedDefaults) window.__trackedDefaults = JSON.parse(JSON.stringify(EventSigns.CONFIG.tracked));
      EventSigns.CONFIG.tracked = JSON.parse(JSON.stringify(window.__trackedDefaults));
      if (c.tracked && c.tracked.donate !== undefined) EventSigns.CONFIG.tracked.donate = { url: c.tracked.donate, file: '' };
      if (c.tracked && c.tracked.apps) Object.keys(c.tracked.apps).forEach(k => { EventSigns.CONFIG.tracked.apps[k] = { url: c.tracked.apps[k], file: '' }; });
      if (c.colorway) state.colorway = c.colorway;
      if (c.accent) state.accent = c.accent;
      if (c.size) state.size = c.size;
      if (c.orientation) state.orientation = c.orientation;
      Object.assign(state.fields, c.fields || {});
      const d = EventSigns.dims(state);
      const pdf = await EventSigns.exportPdf(state);
      const bg = await EventSigns.exportPng(state, undefined, { hideReadable: true });
      out.results[name] = { sign: c.sign, fileName: EventSigns.fileName(state), dims: d, pageW: pdf.pageW, pageH: pdf.pageH,
        pdf: await toDataUrl(pdf.blob), bg: bg.url, warnings: pdf.warnings, sizes: pdf.sizes, width: pdf.width, height: pdf.height };
    }
  } catch (e) { out.error = String(e && e.stack || e); }
  document.getElementById('out').textContent = JSON.stringify(out);
  document.title = 'DONE';
})();
</script>
</body></html>
